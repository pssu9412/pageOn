<!DOCTYPE html>
<html lang="en" data-layout="horizontal" data-topbar-color="dark">


    <head>
        <meta charset="utf-8" />
        <title>이벤트 등록</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />

        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

		<!-- Theme Config Js -->
		<script src="assets/js/head.js"></script>

		<!-- Bootstrap css -->
		<link href="assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" id="app-style" />

		<!-- App css -->
		<link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />

		<!-- Icons css -->
		<link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
        
        <!-- 개인 custom css -->
        <link rel="stylesheet" href="assets/css/min-custom.css"> 
        <link rel="stylesheet" href="assets/css/custom.css"> 
        <link rel="stylesheet" href="assets/css/yj-custom.css">
        <link rel="stylesheet" href="assets/css/ssu-custom.css"> 
    </head>

     <body>
    <!-- Begin page -->
    <div id="wrapper">
      <div class="content-page">
 
        <!-- ========== Topbar Start ========== -->
        <div class="navbar-custom">
          <div class="topbar">
            <div class="topbar-menu d-flex align-items-center gap-1">
              <div class="logo-box">
                <a href="민정_관리자메인화면.html" class="logo-light">
                  <img src="assets/images/pageon/logo-gray.jpeg" alt="logo" class="logo-lg" />
                  <img src="assets/images/pageon/logo-gray.jpeg" alt="logo" class="logo-sm" />
                </a>
                <a href="민정_관리자메인화면.html" class="logo-dark">
                  <img src="assets/images/pageon/logo-gray.jpeg" alt="dark logo" class="logo-lg" />
                  <img src="assets/images/pageon/logo-gray.jpeg" alt="logo" class="logo-sm" />
                </a>
              </div>
            </div>
            <div class="topbar-menu d-flex flex-column align-items-center">
              <div class="topbar-right-bottom">
                <ul class="topbar-menu d-flex align-items-center">
                  <li class="dropdown">
                    <a class="nav-link dropdown-toggle nav-user me-0 waves-effect waves-light" data-bs-toggle="dropdown" href="#" role="button">
                      <img src="assets/images/users/user-1.jpg" alt="user-image" class="rounded-circle" />
                      <span class="ms-1 d-none d-md-inline-block"> 관리자 <i class="mdi mdi-chevron-down"></i> </span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <!-- ========== Topbar End ========== -->
 
        <div class="content">
          <div class="container-fluid">
 
            <div class="form-wrap">
              <h4 class="page-title-bar">이벤트 등록</h4>
 
              <form id="event-form">
 
                <!-- 이벤트 분류 -->
                <div class="form-section">
                  <div class="form-section-label">이벤트 분류</div>
                  <select class="form-control-plain" id="event-category" onchange="onCategoryChange()">
                    <option value="work">작품 이벤트</option>
                    <option value="coupon">할인쿠폰 이벤트</option>
                  </select>
                </div>
 
                <!-- 이벤트 기간 설정 -->
                <div class="form-section">
                  <div class="form-section-label">이벤트 기간 설정</div>
                  <div class="period-row">
                    <span class="period-label">시작</span>
                    <input type="date" class="form-control-plain" required />
                    <select class="form-control-plain">
                      <option>오전 7시 00분</option>
                      <option>오전 9시 00분</option>
                      <option>오후 12시 00분</option>
                      <option>오후 6시 00분</option>
                    </select>
                  </div>
                  <div class="period-row">
                    <span class="period-label">종료</span>
                    <input type="date" class="form-control-plain" required />
                    <select class="form-control-plain">
                      <option>오전 7시 00분</option>
                      <option>오전 9시 00분</option>
                      <option>오후 12시 00분</option>
                      <option>오후 6시 00분</option>
                    </select>
                  </div>
                </div>
 
                <!-- 제목 -->
                <div class="form-section">
                  <div class="form-section-label">제목</div>
                  <input type="text" class="form-control-plain" placeholder="이벤트 제목을 입력해주세요." required />
                </div>
 
                <!-- 썸네일 첨부 -->
                <div class="form-section">
                  <div class="form-section-label">썸네일 첨부</div>
                  <div class="file-attach-row">
                    <button type="button" class="file-btn" onclick="document.getElementById('thumb-file').click()">파일첨부</button>
                    <input type="file" id="thumb-file" accept="image/*" style="display:none;" onchange="onFileSelected(this, 'thumb-name')" />
                    <div class="file-name-box" id="thumb-name">선택된 파일이 없습니다.</div>
                  </div>
                </div>
 
                <!-- 이벤트 소개 입력 -->
                <div class="form-section">
                  <div class="form-section-label">이벤트 소개 입력</div>
                  <div class="editor-wrap">
                    <div class="editor-toolbar">
                      <select>
                        <option>기본서체</option>
                        <option>고딕체</option>
                        <option>명조체</option>
                      </select>
                      <select>
                        <option>14</option>
                        <option>16</option>
                        <option>18</option>
                        <option>20</option>
                      </select>
                      <div class="divider"></div>
                      <i class="tb-icon" style="font-weight:700;">B</i>
                      <i class="tb-icon" style="font-style:italic;">I</i>
                      <i class="tb-icon" style="text-decoration: underline;">U</i>
                      <i class="tb-icon" style="text-decoration: line-through;">S</i>
                      <div class="divider"></div>
                      <i class="mdi mdi-format-align-left tb-icon"></i>
                      <i class="mdi mdi-format-align-center tb-icon"></i>
                      <i class="mdi mdi-format-align-right tb-icon"></i>
                      <div class="divider"></div>
                      <i class="mdi mdi-format-list-bulleted tb-icon"></i>
                      <i class="mdi mdi-emoticon-outline tb-icon"></i>
                      <i class="mdi mdi-table tb-icon"></i>
                      <i class="mdi mdi-link-variant tb-icon"></i>
                      <i class="mdi mdi-close tb-icon"></i>
                    </div>
                    <div
                      class="editor-body"
                      contenteditable="true"
                      data-placeholder="100자 이내"
                      id="event-content-editor"
                      oninput="updateEditorCount()"
                    ></div>
                    <div class="editor-count"><span id="editor-count-num">0</span> / 100자</div>
                  </div>
                </div>
 
                <!-- 이벤트 이미지 첨부 -->
                <div class="form-section">
                  <div class="form-section-label">이벤트 이미지 첨부</div>
                  <div class="file-attach-row">
                    <button type="button" class="file-btn" onclick="document.getElementById('content-image-file').click()">파일첨부</button>
                    <input type="file" id="content-image-file" accept="image/*" style="display:none;" onchange="onFileSelected(this, 'content-image-name')" />
                    <div class="file-name-box" id="content-image-name">선택된 파일이 없습니다.</div>
                  </div>
                </div>
 
                <!-- 작품 이벤트 영역 (분류=work 일 때만 활성) -->
                <div id="work-event-zone">
                  <div class="form-section">
                    <div class="form-section-label">이벤트 작품 설정</div>
                    <button type="button" class="file-btn" onclick="openWorkModal()">작품 선택</button>
 
                    <!-- 선택된 작품 정보 -->
                    <div class="selected-work-card" id="selected-work-card">
                      <div class="selected-work-thumb"><i class="fe-image"></i></div>
                      <div class="selected-work-info">
                        <div class="work-title" id="selected-work-title"></div>
                        <div id="selected-work-meta"></div>
                      </div>
                      <button type="button" class="selected-work-remove" onclick="removeSelectedWork()" title="선택 해제">
                        <i class="mdi mdi-close"></i>
                      </button>
                    </div>
 
                    <!-- 무료 회차 설정: 작품 선택 전까지 비활성화 -->
                    <div class="free-episode-row disabled-zone" id="free-episode-zone">
                      <select class="form-control-plain" id="free-episode-count">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                      </select>
                      <span>회 무료</span>
                    </div>
                    <input type="text" class="form-control-plain disabled-zone mt-2" id="free-episode-note" placeholder="작품 관련 문구 입력" style="margin-top:10px;" />
                  </div>
                </div>
 
                <!-- 쿠폰 할인 설정 (분류 무관 공통 노출) -->
                <div class="form-section">
                  <div class="form-section-label">이벤트 할인 쿠폰 설정</div>
                  <div class="coupon-row">
                    <label>쿠폰 할인율</label>
                    <input type="number" class="form-control-plain" placeholder="할인율 입력" min="0" max="100" />
                    <span class="unit">%</span>
                  </div>
                  <div class="coupon-row">
                    <label>유효기간</label>
                    <select class="form-control-plain">
                      <option>1일</option>
                      <option>3일</option>
                      <option>7일</option>
                      <option>14일</option>
                      <option>30일</option>
                    </select>
                  </div>
                </div>
 
                <!-- 배너 이미지 첨부 -->
                <div class="form-section">
                  <div class="form-section-label">배너 이미지 첨부</div>
                  <div class="file-attach-row">
                    <button type="button" class="file-btn" onclick="document.getElementById('banner-file').click()">파일첨부</button>
                    <input type="file" id="banner-file" accept="image/*" style="display:none;" onchange="onFileSelected(this, 'banner-name')" />
                    <div class="file-name-box" id="banner-name">선택된 파일이 없습니다.</div>
                  </div>
 
                  <div class="banner-position-row">
                    <div class="form-section-sub">배너 위치 설정</div>
                    <select class="form-control-plain">
                      <option>전체</option>
                      <option>메인 상단</option>
                      <option>메인 중단</option>
                      <option>장르별 페이지</option>
                    </select>
                  </div>
                </div>
 
                <!-- 하단 버튼 -->
                <div class="form-actions-bar">
                  <button type="button" class="btn-cancel-form" onclick="history.back()">취소</button>
                  <button type="submit" class="btn-submit-form">등록</button>
                </div>
 
              </form>
            </div>
 
          </div>
        </div>
        <!-- content end -->
 
      </div>
    </div>
    <!-- END wrapper -->
 
    <!-- 작품 선택 모달 -->
    <div class="work-modal-overlay" id="work-modal-overlay">
      <div class="work-modal">
        <div class="work-modal-header">
          <span>이벤트 작품 선택</span>
          <button type="button" onclick="closeWorkModal()"><i class="mdi mdi-close"></i></button>
        </div>
        <div class="work-modal-body">
          <div class="work-search-label">작품 검색</div>
          <div class="work-search-row">
            <select id="work-search-type">
              <option value="title">작품명</option>
              <option value="author">작가명</option>
            </select>
            <div class="search-input-wrap">
              <input type="text" class="form-control-plain" id="work-search-input" placeholder="검색어를 입력해주세요." />
              <i class="mdi mdi-magnify" onclick="searchWorks()"></i>
            </div>
          </div>
 
          <table class="work-table">
            <thead>
              <tr>
                <th style="width:60px;">선택</th>
                <th>출판사</th>
                <th>작품명</th>
                <th>작가명</th>
              </tr>
            </thead>
            <tbody id="work-table-body">
              <!-- JS로 렌더링 -->
            </tbody>
          </table>
        </div>
        <div class="work-modal-footer">
          <button type="button" class="work-modal-close-btn" onclick="closeWorkModal()">닫기</button>
          <button type="button" class="work-modal-confirm-btn" onclick="confirmWorkSelection()">선택완료</button>
        </div>
      </div>
    </div>
 
    <!-- Vendor js -->
    <script src="assets/js/vendor.min.js"></script>
    <!-- App js -->
    <script src="assets/js/app.min.js"></script>
 
    <script>
      /* =============================================
         이벤트 분류 전환 (작품 이벤트 / 할인쿠폰 이벤트)
         쿠폰 설정은 공통이라 항상 노출, 작품 설정만 토글
         ============================================= */
      function onCategoryChange() {
        const category = document.getElementById('event-category').value;
        const workZone = document.getElementById('work-event-zone');
        workZone.style.display = category === 'work' ? 'block' : 'none';
      }
 
      /* =============================================
         파일 첨부
         ============================================= */
      function onFileSelected(input, targetId) {
        const box = document.getElementById(targetId);
        if (input.files && input.files.length > 0) {
          box.textContent = input.files[0].name;
          box.classList.add('has-file');
        } else {
          box.textContent = '선택된 파일이 없습니다.';
          box.classList.remove('has-file');
        }
      }
 
      /* =============================================
         에디터 글자수 카운트 (100자 제한)
         ============================================= */
      function updateEditorCount() {
        const editor = document.getElementById('event-content-editor');
        let text = editor.innerText;
        if (text.length > 100) {
          text = text.slice(0, 100);
          editor.innerText = text;
          // 커서를 맨 뒤로
          const range = document.createRange();
          const sel = window.getSelection();
          range.selectNodeContents(editor);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }
        document.getElementById('editor-count-num').textContent = text.length;
      }
 
      /* =============================================
         작품 선택 모달
         ============================================= */
      const dummyWorks = [
        { id: 1, publisher: '양식집출판사', title: '봉골레 파스타 하나요~!', author: '요리사' },
        { id: 2, publisher: '한식맏집출판사', title: '불금의 폭소터 하근이~', author: '오시자' },
        { id: 3, publisher: '양식집출판사', title: '카르보나라 좋아하세요?', author: '요리사' },
        { id: 4, publisher: '중식당출판사', title: '짜장면이 더 좋은 이유', author: '면식가' },
        { id: 5, publisher: '일식집출판사', title: '오늘 점심은 우동이지', author: '면식가' },
        { id: 6, publisher: '양식집출판사', title: '리조또 끓이는 밤', author: '요리사' },
      ];
 
      let pendingSelectedWork = null; // 모달 안에서 라디오로 임시 선택된 작품
      let confirmedWork = null; // '선택완료' 눌러서 확정된 작품
 
      function renderWorkTable(list) {
        const tbody = document.getElementById('work-table-body');
        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="padding:24px; color:#999;">검색 결과가 없습니다.</td></tr>`;
          return;
        }
        tbody.innerHTML = list
          .map(
            (w) => `
          <tr onclick="selectWorkRadio(${w.id})">
            <td><input type="radio" name="work-radio" value="${w.id}" ${pendingSelectedWork === w.id ? 'checked' : ''} onclick="event.stopPropagation(); selectWorkRadio(${w.id})" /></td>
            <td>${w.publisher}</td>
            <td>${w.title}</td>
            <td>${w.author}</td>
          </tr>
        `
          )
          .join('');
      }
 
      function selectWorkRadio(id) {
        pendingSelectedWork = id;
        renderWorkTable(currentWorkList);
      }
 
      let currentWorkList = dummyWorks;
 
      function searchWorks() {
        const type = document.getElementById('work-search-type').value;
        const keyword = document.getElementById('work-search-input').value.trim();
        if (!keyword) {
          currentWorkList = dummyWorks;
        } else {
          currentWorkList = dummyWorks.filter((w) => {
            const target = type === 'title' ? w.title : w.author;
            return target.includes(keyword);
          });
        }
        renderWorkTable(currentWorkList);
      }
 
      function openWorkModal() {
        pendingSelectedWork = confirmedWork ? confirmedWork.id : null;
        currentWorkList = dummyWorks;
        renderWorkTable(currentWorkList);
        document.getElementById('work-modal-overlay').classList.add('show');
      }
 
      function closeWorkModal() {
        document.getElementById('work-modal-overlay').classList.remove('show');
      }
 
      // 작품은 1개만 선택 가능 (라디오 버튼 기반이라 자연히 단일 선택)
      function confirmWorkSelection() {
        if (pendingSelectedWork == null) {
          alert('작품을 1개 선택해주세요.');
          return;
        }
        confirmedWork = dummyWorks.find((w) => w.id === pendingSelectedWork);
        applySelectedWork(confirmedWork);
        closeWorkModal();
      }
 
      function applySelectedWork(work) {
        document.getElementById('selected-work-title').textContent = work.title;
        document.getElementById('selected-work-meta').textContent = `${work.publisher} · ${work.author}`;
        document.getElementById('selected-work-card').classList.add('show');
 
        // 작품이 선택되면 무료 회차 설정 활성화
        document.getElementById('free-episode-zone').classList.remove('disabled-zone');
        document.getElementById('free-episode-note').classList.remove('disabled-zone');
      }
 
      function removeSelectedWork() {
        confirmedWork = null;
        document.getElementById('selected-work-card').classList.remove('show');
 
        // 작품 선택이 해제되면 무료 회차 설정 다시 비활성화
        document.getElementById('free-episode-zone').classList.add('disabled-zone');
        document.getElementById('free-episode-note').classList.add('disabled-zone');
      }
 
      /* =============================================
         폼 제출
         ============================================= */
      document.getElementById('event-form').addEventListener('submit', function (e) {
        e.preventDefault();
 
        const category = document.getElementById('event-category').value;
        if (category === 'work' && !confirmedWork) {
          alert('작품 이벤트는 작품을 1개 선택해야 합니다.');
          return;
        }
 
        // TODO: 실제 서버 전송 로직 연결
        alert('이벤트가 등록되었습니다.');
      });
    </script>
  </body>
