    <script>
      /* URL 파라미터 */
      var authorId = new URLSearchParams(window.location.search).get('id') || '1';
 
      /* 더미 작가 데이터 */
      var authorData = {
        name: 'OOO',
        award: '여기에 수상 내역을 작성합니다.\n수상 내역이 없으면 수상 부분은 안 넣으면 되죠',
        updateDate: '2026.xx.xx 업데이트',
        intro: '여기에 작가의 말이 나옵니다.\n마찬가지로 작가의 말이 없으면 해당 없음으로 이 부분도 안 넣으면 되죠',
      };
 
      /* 더미 작품 데이터 */
      var dummyWorks = (function() {
        var titles = ['그놈은 멋있었다....', '빨강 망둥 감자차', '네 이름은 탕정, 코난이죠'];
        var genres = ['로맨스', '로판', '판타지'];
        var result = [];
        for (var i = 0; i < 20; i++) {
          result.push({
            id: i,
            title: titles[i % titles.length],
            genre: genres[i % genres.length],
            author: 'OOO',
            publisher: 'OO출판사',
            totalEpisodes: 138,
            favorites: Math.floor(Math.random() * 3000),
            latest: new Date(2024, i % 12, (i % 28) + 1).getTime(),
            desc: '그놈은 멋있었다....그 멋있는 놈이 왜...어카니아 라마이렇이 렇이아 이아 아 두 돌 까지하고 나머지는 점점점...',
          });
        }
        return result;
      })();
 
      /* 상태 */
      var isSubscribed = false;
      var currentSort = 'latest';
      var currentPage = 1;
      var PAGE_SIZE = 10;
 
      /* 구독 토글 */
      function toggleSubscribe() {
        isSubscribed = !isSubscribed;
        var btn = document.getElementById('subscribe-btn');
        if (isSubscribed) {
          btn.textContent = '구독 중';
          btn.classList.add('subscribed');
        } else {
          btn.textContent = '구독';
          btn.classList.remove('subscribed');
        }
        // TODO: 서버 API 호출
      }
 
      /* 정렬 탭 */
      function selectSort(btn) {
        document.querySelectorAll('.sort-tab').forEach(function(t) { t.classList.remove('active'); });
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        currentPage = 1;
        renderWorks();
      }
 
      /* 작품 렌더링 */
      function renderWorks() {
        var works = dummyWorks.slice();
 
        if (currentSort === 'latest') {
          works.sort(function(a, b) { return b.latest - a.latest; });
        } else if (currentSort === 'favorite') {
          works.sort(function(a, b) { return b.favorites - a.favorites; });
        }
 
        var total = works.length;
        document.getElementById('work-count').textContent = '총 ' + total + '중';
 
        var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = 1;
        var pageItems = works.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
 
        var list = document.getElementById('work-list');
        if (pageItems.length === 0) {
          list.innerHTML = '<p style="color:#aaa; text-align:center; padding:40px 0;">작품이 없습니다.</p>';
        } else {
          var html = '';
          pageItems.forEach(function(w) {
            html += '<a href="작품상세.html?id=' + w.id + '" class="work-item">'
              + '<div class="work-item-thumb"><i class="fe-image"></i></div>'
              + '<div class="work-item-info">'
              + '<span class="work-item-genre">' + w.genre + '</span>'
              + '<div class="work-item-title">' + w.title + '</div>'
              + '<div class="work-item-meta">' + w.author + ' | ' + w.publisher + ' | 총 ' + w.totalEpisodes + '화 | ' + w.genre + '</div>'
              + '<div class="work-item-favorites">♥(' + w.favorites.toLocaleString() + ')</div>'
              + '<div class="work-item-desc">' + w.desc + '</div>'
              + '</div></a>';
          });
          list.innerHTML = html;
        }
        renderPagination(currentPage, totalPages);
      }
 
      /* 페이지네이션 */
      function renderPagination(current, total) {
        var el = document.getElementById('author-pagination');
        if (total <= 1) { el.innerHTML = ''; return; }
        var pages = getPageNumbers(current, total);
        var html = '<button ' + (current === 1 ? 'disabled' : '') + ' onclick="goPage(' + (current - 1) + ')">&larr; 이전</button>';
        pages.forEach(function(p) {
          if (p === '...') html += '<span style="color:#ccc">...</span>';
          else html += '<span class="page-num ' + (p === current ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</span>';
        });
        html += '<button ' + (current === total ? 'disabled' : '') + ' onclick="goPage(' + (current + 1) + ')">다음 &rarr;</button>';
        el.innerHTML = html;
      }
 
      function getPageNumbers(current, total) {
        var range = [], result = [], last;
        for (var i = 1; i <= total; i++) {
          if (i === 1 || i === total || Math.abs(i - current) <= 1) range.push(i);
        }
        range.forEach(function(i) {
          if (last && i - last === 2) result.push(last + 1);
          else if (last && i - last > 1) result.push('...');
          result.push(i);
          last = i;
        });
        return result;
      }
 
      function goPage(p) {
        currentPage = p;
        renderWorks();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
 
      /* 초기화 */
      renderWorks();
    </script>
