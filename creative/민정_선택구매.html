    <div class="pay-modal-overlay" id="pay-modal">

      </div>

    <script src="assets/js/vendor.min.js"></script>
    <script src="assets/js/app.min.js"></script>
    <script>
      var myPoint = 2000;
      var PRICE_PER_EP = 100;
 
      /* 더미 회차 데이터 */
      var episodes = (function() {
        var result = [];
        for (var i = 1; i <= 68; i++) {
          result.push({
            id: i,
            title: '어두운 바다의 등불이 되어 ' + i + '화',
            date: '2025.04.18',
            isFree: i <= 3,
            isOwned: i <= 3,
            checked: false,
          });
        }
        return result;
      })();
 
      var currentSort = 'newest';
 
      function getSortedEpisodes() {
        var list = episodes.filter(function(ep) { return !ep.isOwned; });
        if (currentSort === 'newest') list = list.slice().reverse();
        return list;
      }
 
      function renderList() {
        var list = getSortedEpisodes();
        var html = '';
        list.forEach(function(ep) {
          html += '<div class="select-episode-item" onclick="toggleCheck(' + ep.id + ')">'
            + '<input type="checkbox" ' + (ep.checked ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleCheck(' + ep.id + ')" />'
            + '<div class="ep-item-info">'
            + '<div class="ep-item-title">' + ep.title + (ep.isFree ? '<span class="ep-free-badge">무료</span>' : '') + '</div>'
            + '<div class="ep-item-date">' + ep.date + '</div>'
            + '</div></div>';
        });
        document.getElementById('select-episode-list').innerHTML = html;
        updateBuyBtn();
      }
 
      function toggleCheck(id) {
        var ep = episodes.find(function(e) { return e.id === id; });
        if (ep && !ep.isOwned) {
          ep.checked = !ep.checked;
          renderList();
        }
      }
 
      function toggleAll(checkbox) {
        var list = getSortedEpisodes();
        list.forEach(function(ep) { ep.checked = checkbox.checked; });
        renderList();
      }
 
      function sortEpisodes() {
        currentSort = document.getElementById('sort-select').value;
        renderList();
      }
 
      function updateBuyBtn() {
        var selected = episodes.filter(function(ep) { return ep.checked; });
        var btn = document.getElementById('btn-buy-selected');
        btn.textContent = '총 ' + selected.length + '화 구매하기';
        btn.disabled = selected.length === 0;
      }
 
      function openBuyModal() {
        var selected = episodes.filter(function(ep) { return ep.checked; });
        var count = selected.length;
        var total = count * PRICE_PER_EP;
        var hasEnough = myPoint >= total;
 
        document.getElementById('pay-modal-work-title').textContent = '선택한 ' + count + '화';
        document.getElementById('pay-modal-price').textContent = '결제 포인트: ' + total + ' P';
        document.getElementById('pay-modal-my-point').textContent = '보유 포인트: ' + myPoint.toLocaleString() + ' P';
        document.getElementById('pay-modal-warn').textContent = hasEnough ? '' : '보유 포인트가 부족합니다.';
 
        var actions = document.getElementById('pay-modal-actions');
        if (hasEnough) {
          actions.innerHTML = '<button type="button" class="pay-btn-primary" onclick="confirmBuy()">결제하기</button>';
        } else {
          actions.innerHTML = '<button type="button" class="pay-btn-charge" onclick="location.href=\'포인트충전.html\'">포인트 충전하기</button>';
        }
        document.getElementById('pay-modal').classList.add('show');
      }
 
      function closeModal() {
        document.getElementById('pay-modal').classList.remove('show');
      }
 
      function confirmBuy() {
        var selected = episodes.filter(function(ep) { return ep.checked; });
        var total = selected.length * PRICE_PER_EP;
        myPoint -= total;
        selected.forEach(function(ep) { ep.isOwned = true; ep.checked = false; });
        closeModal();
        alert('결제가 완료되었습니다!');
        renderList();
      }
 
      renderList();
    </script>
