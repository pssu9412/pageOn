      var waitingList = [
        { id: 'kimyj01', name: '김영주', email: 'dragonzoo12@naver.com', phone: '010-1212-2523' },

      var searchResultUser = null;

      /* ── RIGHT-02: 아이디 검색 ── */
      function searchAdmin() {
        var keyword = document.getElementById('search-input').value.trim();
        if (!keyword) return;

        var found = dummyUsers.find(function(u) { return u.id === keyword; });
        var resultRow = document.getElementById('search-result-row');

        if (found) {
          searchResultUser = found;
          document.getElementById('search-result-name').textContent = found.name;
          document.getElementById('search-result-email').textContent = found.email;
          document.getElementById('search-result-phone').textContent = found.phone;
          resultRow.classList.add('show');
        } else {
          searchResultUser = null;
          resultRow.classList.remove('show');
          alert('해당 아이디의 사용자를 찾을 수 없습니다.');
        }
      }

      function addToWaiting() {
        if (!searchResultUser) return;
        var already = waitingList.find(function(w) { return w.id === searchResultUser.id; });
        if (already) { alert('이미 대기 목록에 있습니다.'); return; }
        waitingList.push(searchResultUser);
        searchResultUser = null;
        document.getElementById('search-result-row').classList.remove('show');
        document.getElementById('search-input').value = '';
        renderWaitingList();
      }

      /* ── RIGHT-03: 대기 목록 렌더링 ── */
      function renderWaitingList() {
        var list = document.getElementById('waiting-list');
        if (waitingList.length === 0) {
          list.innerHTML = '<div style="padding:16px 20px; color:#aaa; font-size:13px;">대기 목록이 없습니다.</div>';
          return;
        }
        var html = '';
        waitingList.forEach(function(w) {
          html += '<div class="waiting-item">'
            + '<span class="waiting-name">' + w.name + '</span>'
            + '<span class="waiting-email">' + w.email + '</span>'
            + '<span class="waiting-phone">' + w.phone + '</span>'
            + '<button type="button" class="btn-remove" onclick="removeFromWaiting(\'' + w.id + '\')" title="일반 회원으로">&#8722;</button>'
            + '</div>';
        });
        list.innerHTML = html;
      }

      function removeFromWaiting(id) {
        waitingList = waitingList.filter(function(w) { return w.id !== id; });
        renderWaitingList();
        // TODO: 서버 API - 관리자 → 일반 회원으로
      }

      /* ── RIGHT-01: 조직도 렌더링 ── */
      function renderOrgGrid() {
        var grid = document.getElementById('org-grid');
        var html = '';
        departments.forEach(function(dept, deptIdx) {
          html += '<div class="org-card" id="dept-' + deptIdx + '"'
            + ' ondragover="onDragOver(event, ' + deptIdx + ')"'
            + ' ondrop="onDrop(event, ' + deptIdx + ')"'
            + ' ondragleave="onDragLeave(' + deptIdx + ')">'
            + '<div class="org-card-header" id="dept-header-' + deptIdx + '">' + dept.name + '</div>'
            + '<div class="org-card-body">';
          dept.members.forEach(function(m) {
            html += '<div class="org-member-item"'
              + ' draggable="true"'
              + ' ondragstart="onDragStart(event, \'' + m.id + '\', ' + deptIdx + ')"'
              + ' ondragend="onDragEnd(event)"'
              + ' onclick="openMemberModal(\'' + m.id + '\')">'
              + '<span class="member-name">' + m.name + '</span>'
              + '</div>';
          });
          html += '</div></div>';
        });
        grid.innerHTML = html;
      }

      /* ── RIGHT-04: 드래그앤드롭 ── */
      function onDragStart(event, memberId, deptIdx) {
        draggedMember = memberId;
        draggedFromDept = deptIdx;
        event.dataTransfer.effectAllowed = 'move';
        setTimeout(function() {
          var el = event.target;
          if (el) el.classList.add('dragging');
        }, 0);
      }

      function onDragEnd(event) {
        var el = event.target;
        if (el) el.classList.remove('dragging');
      }

      function onDragOver(event, deptIdx) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        document.getElementById('dept-header-' + deptIdx).style.background = '#3b82f6';
      }

      function onDragLeave(deptIdx) {
        document.getElementById('dept-header-' + deptIdx).style.background = '#555';
      }

      function onDrop(event, targetDeptIdx) {
        event.preventDefault();
        document.getElementById('dept-header-' + targetDeptIdx).style.background = '#555';

        if (draggedFromDept === targetDeptIdx || draggedMember === null) return;

        /* 멤버 찾아서 이동 */
        var fromDept = departments[draggedFromDept];
        var toDept = departments[targetDeptIdx];
        var memberIdx = fromDept.members.findIndex(function(m) { return m.id === draggedMember; });

        if (memberIdx !== -1) {
          var member = fromDept.members.splice(memberIdx, 1)[0];
          member.dept = toDept.name;
          toDept.members.push(member);
          renderOrgGrid();
          // TODO: 서버 API - 권한 이동
        }

        draggedMember = null;
        draggedFromDept = null;
      }

      /* ── 직원 상세 모달 ── */
      function openMemberModal(memberId) {
        var member = null;
        departments.forEach(function(dept) {
          dept.members.forEach(function(m) {
            if (m.id === memberId) member = m;
          });
        });
        if (!member) return;

        selectedMember = member;
        document.getElementById('modal-member-name').textContent = member.name + ' 상세';
        document.getElementById('modal-id').textContent = member.id;
        document.getElementById('modal-name').textContent = member.name;
        document.getElementById('modal-email').textContent = member.email;
        document.getElementById('modal-phone').textContent = member.phone;
        document.getElementById('modal-dept').textContent = member.dept;
        document.getElementById('modal-role').textContent = member.role;
        document.getElementById('member-modal').classList.add('show');
      }

      function closeMemberModal() {
        document.getElementById('member-modal').classList.remove('show');
        selectedMember = null;
      }

      function revokeAdmin() {
        if (!selectedMember) return;
        if (!confirm(selectedMember.name + ' 님의 권한을 박탈하시겠습니까?')) return;

        /* 조직도에서 제거 */
        departments.forEach(function(dept) {
          dept.members = dept.members.filter(function(m) { return m.id !== selectedMember.id; });
        });

        closeMemberModal();
        renderOrgGrid();
        // TODO: 서버 API - 권한 박탈
      }

      /* 모달 외부 클릭 닫기 */
      document.getElementById('member-modal').addEventListener('click', function(e) {
        if (e.target === this) closeMemberModal();
      });

      /* 초기화 */
      renderWaitingList();
      renderOrgGrid();
