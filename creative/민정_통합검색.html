          <div class="container-fluid">
 
            <!-- 검색어 표시 -->
            <p class="search-page-title">검색페이지</p>
 
            <!-- ── 작가 섹션 ── -->
            <div class="section-header">
              <div class="section-title">작가 <span class="count" id="author-count">총 0명</span></div>
              <button type="button" class="more-btn" id="author-more-btn" onclick="toggleAuthorMore()">
                작가 더 보기 <i class="mdi mdi-chevron-down" id="author-more-icon"></i>
              </button>
            </div>
            <div class="author-list" id="author-list"></div>
 
            <hr class="section-divider" />
 
            <!-- ── 작품 섹션 ── -->
            <div class="section-header">
              <div class="section-title">작품 <span class="count" id="work-count">총 0건</span></div>
            </div>
 
            <!-- 정렬 탭 + 성인제외 -->
            <div class="sort-tab-wrap">
              <div class="sort-tabs">
                <button type="button" class="sort-tab active" data-sort="accuracy" onclick="selectSort(this)">정확도순</button>
                <button type="button" class="sort-tab" data-sort="latest" onclick="selectSort(this)">최신순</button>
                <button type="button" class="sort-tab" data-sort="favorite" onclick="selectSort(this)">선호작순</button>
                <button type="button" class="sort-tab" data-sort="episode" onclick="selectSort(this)">화차순</button>
              </div>
              <label class="adult-exclude-label">
                <input type="checkbox" id="adult-exclude-check" checked onchange="renderWorks()" />
                성인 제외
              </label>
            </div>
 
            <div id="work-grid"></div>
            <div class="search-pagination" id="search-pagination"></div>

    <script src="assets/js/vendor.min.js"></script>
    <script src="assets/js/app.min.js"></script>
    <script>
      /* URL 파라미터에서 검색어 가져오기 */
      var keyword = new URLSearchParams(window.location.search).get('q') || '';
 
      /* 검색어 없을 때 빈 상태 처리 */
      if (!keyword.trim()) {
        document.querySelector('.search-page-title').innerHTML = '';
        document.getElementById('author-list').innerHTML = '<p style="color:#aaa; font-size:14px;">검색 결과가 없습니다.</p>';
        document.getElementById('work-grid').innerHTML = '<div class="no-result" style="grid-column:1/-1">검색어를 입력하면 결과가 표시됩니다.</div>';
        document.getElementById('author-count').textContent = '총 0명';
        document.getElementById('work-count').textContent = '총 0건';
        document.getElementById('author-more-btn').style.display = 'none';
      } else {
        document.querySelector('.search-page-title').innerHTML = '<span>' + keyword + '</span> 검색 결과';
      }
 
      /* 더미 데이터 */
      var dummyAuthors = [
        { id: 1, name: '니비', works: '에스프레소 더블샷 2권 (완결)' },
        { id: 2, name: '니케(Nike)', works: '슈론치우론2권 (완결)' },
        { id: 3, name: '타이러 제제 비론', works: '퍼즈 와이크' },
        { id: 4, name: '작가명4', works: '작품명4' },
        { id: 5, name: '작가명5', works: '작품명5' },
      ];
 
      var dummyWorks = (function() {
        var titles = ['그놈은 멋있었다....', '봉골레 파스타 하나요~!', '살인사건 발생! 범인을 찾아라', '카르보나라 좋아하세요?'];
        var result = [];
        for (var i = 0; i < 22; i++) {
          result.push({
            id: i,
            title: titles[i % titles.length],
            publisher: 'OO출판사', author: '카니니',
            totalEpisodes: 138, price: 1800,
            favorites: Math.floor(Math.random() * 3000),
            latest: new Date(2024, i % 12, (i % 28) + 1).getTime(),
            desc: '그놈은 멋있었다....그 멋있는 놈이 왜...어카니아 라마이렇이 렇이아 이아 아...',
            isAdult: i % 6 === 0,
          });
        }
        return result;
      })();
 
      /* 상태 */
      var currentSort = 'accuracy';
      var currentPage = 1;
      var PAGE_SIZE = 10;
      var authorShowAll = false;
      var AUTHOR_PREVIEW = 3;
 
      /* ── 작가 렌더링 ── */
      function renderAuthors() {
        var list = document.getElementById('author-list');
        var countEl = document.getElementById('author-count');
        var moreBtn = document.getElementById('author-more-btn');
        var total = dummyAuthors.length;
        countEl.textContent = '총 ' + total + '명';
 
        var shown = authorShowAll ? dummyAuthors : dummyAuthors.slice(0, AUTHOR_PREVIEW);
        var html = '';
        shown.forEach(function(a) {
          html += '<a href="작가페이지.html?id=' + a.id + '" class="author-item">'
            + '<div class="author-avatar"><i class="fe-user"></i></div>'
            + '<div class="author-info">'
            + '<div class="author-name">' + a.name + '</div>'
            + '<div class="author-work">' + a.works + '</div>'
            + '</div></a>';
        });
        list.innerHTML = html;
 
        if (total <= AUTHOR_PREVIEW) {
          moreBtn.style.display = 'none';
        } else {
          moreBtn.style.display = 'flex';
          moreBtn.querySelector('span') && null;
          moreBtn.innerHTML = (authorShowAll ? '작가 접기 ' : '작가 더 보기 ')
            + '<i class="mdi ' + (authorShowAll ? 'mdi-chevron-up' : 'mdi-chevron-down') + '"></i>';
          moreBtn.setAttribute('onclick', 'toggleAuthorMore()');
        }
      }
 
      function toggleAuthorMore() {
        authorShowAll = !authorShowAll;
        renderAuthors();
      }
 
      /* ── 작품 정렬 탭 ── */
      function selectSort(btn) {
        if (!keyword.trim()) return;
        document.querySelectorAll('.sort-tab').forEach(function(t) { t.classList.remove('active'); });
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        currentPage = 1;
        renderWorks();
      }
 
      /* ── 작품 렌더링 ── */
      function renderWorks() {
        if (!keyword.trim()) return;
        var excludeAdult = document.getElementById('adult-exclude-check').checked;
        var works = dummyWorks.slice();
 
        if (excludeAdult) works = works.filter(function(w) { return !w.isAdult; });
 
        if (currentSort === 'accuracy') {
          /* 정확도순: 기본 순서 유지 */
        } else if (currentSort === 'latest') {
          works.sort(function(a, b) { return b.latest - a.latest; });
        } else if (currentSort === 'favorite') {
          works.sort(function(a, b) { return b.favorites - a.favorites; });
        } else if (currentSort === 'episode') {
          works.sort(function(a, b) { return b.totalEpisodes - a.totalEpisodes; });
        }
 
        var total = works.length;
        document.getElementById('work-count').textContent = '총 ' + total + '건';
 
        var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = 1;
        var pageItems = works.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
 
        var grid = document.getElementById('work-grid');
        if (pageItems.length === 0) {
          grid.innerHTML = '<div class="no-result" style="grid-column:1/-1">검색 결과가 없습니다.</div>';
        } else {
          var html = '';
          pageItems.forEach(function(w) {
            html += '<a href="작품상세.html?id=' + w.id + '" class="work-card">'
              + '<div class="work-card-thumb"><i class="fe-image"></i></div>'
              + '<div class="work-card-info">'
              + '<div class="work-card-title">' + w.title + '</div>'
              + '<div class="work-card-meta">' + w.author + ' | ' + w.publisher + ' | 총 ' + w.totalEpisodes + '화</div>'
              + '<div class="work-card-price">구매 (' + w.price.toLocaleString() + ')</div>'
              + '<div class="work-card-desc">' + w.desc + '</div>'
              + '</div></a>';
          });
          grid.innerHTML = html;
        }
        renderPagination(currentPage, totalPages);
      }
 
      /* ── 페이지네이션 ── */
      function renderPagination(current, total) {
        var el = document.getElementById('search-pagination');
        if (total <= 1) { el.innerHTML = ''; return; }
        var pages = getPageNumbers(current, total);
        var html = '<button ' + (current === 1 ? 'disabled' : '') + ' onclick="goPage(' + (current - 1) + ')">&lt; 이전</button>';
        pages.forEach(function(p) {
          if (p === '...') html += '<span style="color:#ccc">...</span>';
          else html += '<span class="page-num ' + (p === current ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</span>';
        });
        html += '<button ' + (current === total ? 'disabled' : '') + ' onclick="goPage(' + (current + 1) + ')">다음 &gt;</button>';
        el.innerHTML = html;
      }
 
      function getPageNumbers(current, total) {
        var range = [], result = [], last;
        for (var i = 1; i <= total; i++) {
          if (i === 1 || i === total || Math.abs(i - current) <= 1) range.push(i);
        }
        range.forEach(function(i) {
          if (last && i - last === 2) result.push(last + 1);
          else if (last && i - last > 1) result.push('...');
          result.push(i);
          last = i;
        });
        return result;
      }
 
      function goPage(p) {
        currentPage = p;
        renderWorks();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
 
      /* 초기화 */
      if (keyword.trim()) {
        renderAuthors();
        renderWorks();
      }
    </script>
