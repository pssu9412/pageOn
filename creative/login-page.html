<!DOCTYPE html>
<html lang="ko" data-layout="horizontal" data-topbar-color="dark">

    <head>
        <meta charset="utf-8" />
        <title>Log In</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />

        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

		<!-- Theme Config Js -->
		<script src="assets/js/head.js"></script>

		<!-- Bootstrap css -->
		<link href="assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" id="app-style" />

		<!-- App css -->
		<link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />

		<!-- Icons css -->
		<link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />

        <link rel="stylesheet" href="assets/css/ssu-custom.css"> 
    </head>

    <body>

        <div class="account-pages mt-5 mb-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-auto">
                        <div class="card">

                            <div class="card-body p-4">
                                
                                <div class="text-center w-50 m-auto">
                                    <div class="auth-brand">
                                        <a href="index.html" class="logo">
                                            <span class="logo-lg">
                                                <!-- 로고 부분? -->
                                                <img src="assets/images/pageon/logo-gray.jpeg" alt="" height="100">
                                            </span>
                                        </a>
                    
                                    </div>
                                    <!-- <p class="text-muted mb-4 mt-3">Enter your email address and password to access admin panel.</p> -->
                                </div>

                                <form action="#">

                                    <div class="mb-3">
                                        <label for="emailaddress" class="form-label">아이디</label>
                                        <input class="form-control" type="email" id="emailaddress" required="" placeholder="Enter your id">
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">비밀번호</label>
                                        <div class="input-group input-group-merge">
                                            <input type="password" id="password" class="form-control" placeholder="Enter your password">
                                            <div class="input-group-text" data-password="false">
                                                <span class="password-eye"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="checkbox-signin" checked>
                                            <label class="form-check-label" for="checkbox-signin">로그인 상태 유지</label>
                                        </div>
                                    </div>

                                    <div class="text-center">
                                        <button class="btn btn-dark" type="submit" style="width: 200px;"> Log In </button>
                                    </div>

                                </form>

                                <div class="text-center">
                                    <ul class="social-list list-inline mt-3 mb-0">
                                        <li class="list-inline-item">
                                            <a href="javascript: void(0);" class="social-list-item border-danger text-danger"><i class="mdi mdi-google"></i></a>
                                        </li>
                                        <!-- 카카오, 네이버 추가하기 -->
                                        <li class="list-inline-item">
                                            <a href="javascript: void(0);" class="social-list-item border-info text-info"><i class="mdi mdi-twitter"></i></a>
                                        </li>
                                        <li class="list-inline-item">
                                            <a href="javascript: void(0);" class="social-list-item border-secondary text-secondary"><i class="mdi mdi-github"></i></a>
                                        </li>
                                    </ul>
                                    <div class="row mt-3">
                                        <div class="col-12 text-center">
                                            <p> <a href="auth-recoverpw.html" class="text-black-50 ms-1">아이디 찾기</a> 
                                                |<a href="auth-recoverpw.html" class="text-black-50 ms-1">비밀번호 찾기</a> 
                                                |<a href="auth-register.html" class="text-black-50 ms-1">회원가입</a> </p>
                                        </div> <!-- end col -->
                                    </div>
                                </div>

                            </div> <!-- end card-body -->
                        </div>
                        <!-- end card -->

                    </div> <!-- end col -->
                </div>
                <!-- end row -->
            </div>
            <!-- end container -->
        </div>
        <!-- end page -->


        <footer class="footer footer-alt">
            &copy;by <a href="" class="text-black-50">PageOn</a> 
        </footer>

        <!-- Authentication js -->
        <script src="assets/js/pages/authentication.init.js"></script>

    </body>
</html>
