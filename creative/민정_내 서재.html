    <script>
      // ===== 탭 전환 =====
      function switchLibraryTab(btn) {
        const tabKey = btn.dataset.tab;
 
        document.querySelectorAll('.library-tab').forEach(tab => tab.classList.remove('active'));
        btn.classList.add('active');
 
        // 패널 전환
        document.querySelectorAll('.library-panel').forEach(panel => (panel.style.display = 'none'));
        const targetPanel = document.getElementById('panel-' + tabKey);
        if (targetPanel) targetPanel.style.display = 'block';
 
        // 툴바(정렬/편집) 전환
        document.querySelectorAll('.toolbar-actions').forEach(t => (t.style.display = 'none'));
        const targetToolbar = document.getElementById('toolbar-' + tabKey);
        if (targetToolbar) targetToolbar.style.display = 'flex';
 
        // 다른 탭으로 이동하면 열려있던 정렬 메뉴 닫기
        closeAllSortMenus();
      }
 
      // ===== 검색 =====
      function searchLibrary() {
        const keyword = document.getElementById('library-search-input').value.trim();
        if (!keyword) return;
        console.log('내 서재 검색어:', keyword);
      }
 
      // ===== 정렬 드롭다운 =====
      function closeAllSortMenus() {
        document.querySelectorAll('.sort-menu').forEach(menu => menu.classList.remove('show'));
      }
 
      function toggleSortMenu(menuId) {
        const menu = document.getElementById(menuId);
        const wasOpen = menu.classList.contains('show');
        closeAllSortMenus();
        if (!wasOpen) menu.classList.add('show');
      }
 
      // 메뉴 바깥 클릭하면 닫기
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.sort-dropdown')) {
          closeAllSortMenus();
        }
      });
 
      function selectSort(tabKey, label, btn) {
        document.getElementById('sort-label-' + tabKey).textContent = label;
 
        // 선택 표시
        const menu = btn.closest('.sort-menu');
        menu.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
 
        closeAllSortMenus();
 
        // TODO: 실제 정렬 로직 연결 (서버 데이터 받아오는 방식이면 여기서 재조회)
        console.log(tabKey + ' 탭 정렬 기준 변경:', label);
      }
 
      // ===== 최근 본 작품: 편집(숨기기) 모드 =====
      function toggleEditMode() {
        const grid = document.getElementById('recent-grid');
        const editBtn = document.getElementById('recent-edit-btn');
        const isEditing = grid.classList.toggle('edit-mode');
        editBtn.classList.toggle('on', isEditing);
        editBtn.textContent = isEditing ? '완료' : '편집';
      }
 
      function toggleHide(toggleEl, event) {
        event.preventDefault();
        event.stopPropagation();
 
        const card = toggleEl.closest('.book-card');
        const icon = toggleEl.querySelector('i');
        const isHidden = card.classList.toggle('hidden-item');
 
        if (isHidden) {
          toggleEl.classList.add('hidden-state');
          toggleEl.title = '숨기기 해제';
          icon.className = 'mdi mdi-eye-outline';
        } else {
          toggleEl.classList.remove('hidden-state');
          toggleEl.title = '숨기기';
          icon.className = 'mdi mdi-eye-off-outline';
        }
      }
 
      // ===== 선호작품: 선작 해제 =====
      function unfavorite(toggleEl) {
        const card = toggleEl.closest('.book-card');
        card.remove();
 
        const grid = document.querySelector('#panel-favorite .library-grid');
        const emptyState = document.getElementById('favorite-empty');
        if (grid && grid.children.length === 0) {
          grid.style.display = 'none';
          if (emptyState) emptyState.style.display = 'block';
        }
      }
    </script>
